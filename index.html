        this._audioCtx=this._audioCtx||new (window.AudioContext||window.webkitAudioContext)();
        const ctx=this._audioCtx;
        const fire=(t)=>{
          const frames=Math.floor(ctx.sampleRate*0.012);
          const buf=ctx.createBuffer(1,frames,ctx.sampleRate);
          const d=buf.getChannelData(0);
          for(let i=0;i<frames;i++) d[i]=(Math.random()*2-1)*(1-i/frames);
          const src=ctx.createBufferSource(), g=ctx.createGain();
          g.gain.value=0.25; src.buffer=buf;
          src.connect(g); g.connect(ctx.destination);
          src.start(t);
        };
        const t=ctx.currentTime;
        if(kind==='rest'){ fire(t); fire(t+0.12); }
        else if(kind==='finish'){ fire(t); fire(t+0.12); fire(t+0.24); }
        else{ fire(t); }
      }catch(e){}
    },

    // ---------- log / stats ----------
    isPartialLog(s){ return !!(s.exDone && s.exDone.some(d=>!d)); },
    completionCount(pid){ return this.log.filter(l=>l.programId===pid).length },
    totalSessions(){ return this.log.length },
    thisMonthCount(){ const n=new Date(); return this.log.filter(l=>{const d=new Date(l.ts);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()}).length },
    currentStreak(){
      if(!this.log.length)return 0;
      const days=new Set(this.log.map(l=>l.date));
      let streak=0, d=new Date();
      while(days.has(this._dateKey(d))){ streak++; d.setDate(d.getDate()-1); }
      // allow streak to start yesterday if nothing today
      if(streak===0){ d=new Date(); d.setDate(d.getDate()-1); while(days.has(this._dateKey(d))){streak++;d.setDate(d.getDate()-1);} }
      return streak;
    },
    recentLog(){ return [...this.log].sort((a,b)=>b.ts-a.ts).slice(0,12) },
    deleteLog(ts){ this.log=this.log.filter(l=>l.ts!==ts); this.save(); },

    // ---------- calendar ----------
    _dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') },
    calLabel(){ return new Date(this.cal.y,this.cal.m,1).toLocaleString(undefined,{month:'long',year:'numeric'}) },
    calShift(n){ let m=this.cal.m+n,y=this.cal.y; if(m<0){m=11;y--} if(m>11){m=0;y++} this.cal.m=m; this.cal.y=y; this.cal.selected=null; this.calDetail=null; },
    calSelectDay(key){ this.cal.selected = this.cal.selected===key ? null : key; this.calDetail=null; },
    calSelectedLog(){ return this.log.filter(l=>l.date===this.cal.selected).sort((a,b)=>b.ts-a.ts); },
    calSelectedItems(){
      const items=this.log.filter(l=>l.date===this.cal.selected).sort((a,b)=>b.ts-a.ts).map(l=>({...l,pending:false}));
      if(this.session){
        const pk=this._dateKey(new Date(this.session.startedTs));
        if(pk===this.cal.selected) items.unshift({ts:this.session.startedTs,name:this.session.name,programId:this.session.programId,date:pk,pending:true,exDone:[...this.session.exDone],names:this.session.entries.map(e=>this.entryTitle(e))});
      }
      return items;
    },
    calSessionTimers(item){
      const lbl=(arr,i)=>arr&&arr[i];
      if(item.exDone && item.names) return item.names.map((name,i)=>({name,done:item.exDone[i]}));
      if(item.exDone && item.timerIds) return item.timerIds.map((id,i)=>({name:this.entryName(id,lbl(item.labels,i)),done:item.exDone[i]}));
      const prog=this.programs.find(p=>p.id===item.programId);
      if(prog) return prog.entries.map(e=>({name:this.entryTitle(e),done:true}));
      return [];
    },
    calToggleDetail(ts){ this.calDetail=this.calDetail===ts?null:ts; },
    calSelectedLabel(){ if(!this.cal.selected)return ''; const [y,m,d]=this.cal.selected.split('-'); return new Date(+y,+m-1,+d).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}); },
    calCells(){
      const y=this.cal.y,m=this.cal.m;
      const first=new Date(y,m,1); let lead=(first.getDay()+6)%7; // Monday start
      const days=new Date(y,m+1,0).getDate();
      const today=this._dateKey(new Date());
      const pendingKey=this.session ? this._dateKey(new Date(this.session.startedTs)) : null;
      const cells=[];
      for(let i=0;i<lead;i++)cells.push(null);
      for(let day=1;day<=days;day++){
        const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
        cells.push({ day, key, isToday:key===today, sessions:this.log.filter(l=>l.date===key), hasPending:key===pendingKey });
      }
      return cells;
    },

    // ---------- export / import ----------
    exportData(){
      const data=JSON.stringify({version:2,programs:this.programs,log:this.log},null,2);
      try{
        const blob=new Blob([data],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url; a.download='interval-timer-data.json';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1000);
      }catch(e){
        // Fallback for sandboxed contexts where downloads are blocked
        const w=window.open('','_blank');
        if(w){ w.document.write('<pre>'+data.replace(/</g,'&lt;')+'</pre>'); }
        else { prompt('Copy your data:', data); }
      }
    },
    importData(ev){
      const file=ev.target.files && ev.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try{
          const d=JSON.parse(reader.result);
          if(!d || typeof d!=='object') throw new Error('bad');
          // 1.x exports reference timers; inline them and keep them for naming old log entries
          (d.programs||[]).forEach(p=>this.migrateProgram(p,d.timers||[]));
          const mode = this.programs.length||this.log.length
            ? (confirm('Replace all current data?\n\nOK = replace everything\nCancel = merge with existing') ? 'replace' : 'merge')
            : 'replace';
          if(mode==='replace'){
            this.timers = d.timers||this.timers;
            this.programs = d.programs||[];
            this.log = d.log||[];
          }else{
            const ids=new Set(this.timers.map(t=>t.id));
            (d.timers||[]).forEach(t=>{ if(!ids.has(t.id)) this.timers.push(t); });
            const pids=new Set(this.programs.map(p=>p.id));
            (d.programs||[]).forEach(p=>{ if(!pids.has(p.id)) this.programs.push(p); });
            const ts=new Set(this.log.map(l=>l.ts));
            (d.log||[]).forEach(l=>{ if(!ts.has(l.ts)) this.log.push(l); });
          }
          this.save();
          alert('Imported '+(d.programs?.length||0)+' programs, '+(d.log?.length||0)+' sessions.');
        }catch(e){
          alert('Could not import: the file is not valid Interval-Timer data.');
        }
        ev.target.value='';
      };
      reader.readAsText(file);
    },
  }
}
</script>
</body>
</html>
