<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Interval Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Interval">
<link rel="apple-touch-icon" href="icon.svg">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #14171e;
    --surface-2: #1c2029;
    --surface-3: #262b36;
    --border: #262b36;
    --text: #eef0f4;
    --muted: #8a90a0;
    --accent: #5b8cff;
    --accent-2: #3ddc97;
    --warn: #ffb02e;
    --danger: #ff5c5c;
    --radius: 16px;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 640px; margin: 0 auto; padding: calc(var(--safe-t) + 8px) 16px calc(var(--safe-b) + 60px); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 16px; }
  header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }
  .version { font-size: 11px; color: var(--muted); font-weight: 600; }

  /* Segmented controls */
  nav, .subtabs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 12px; }
  .subtabs { background: var(--bg); border: 1px solid var(--border); margin: 14px 0; }
  nav button, .subtabs button {
    flex: 1; border: 0; background: transparent; color: var(--muted);
    padding: 9px 10px; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  nav button.active, .subtabs button.active { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  nav button:hover:not(.active) { color: var(--text); }
  textarea.code { width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; line-height: 1.6; white-space: pre; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-top: 12px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; font-weight: 700; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin: 24px 2px 2px; }
  .section-head h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grow { flex: 1; min-width: 0; }

  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; font-weight: 600; }
  input, select {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-size: 15px; outline: none; font-family: inherit;
  }
  textarea { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 10px; outline: none; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--text); margin: 0; cursor: pointer; font-weight: 500; }
  .check input { width: 20px; height: 20px; flex: none; accent-color: var(--accent); }

  button.btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: transform .1s, filter .15s; background: var(--surface-3); color: var(--text);
  }
  button.btn:hover { filter: brightness(1.12); }
  button.btn:active { transform: scale(.97); }
  button.btn:disabled { opacity: .4; pointer-events: none; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.green { background: var(--accent-2); color: #062418; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .btn.icon { padding: 6px 10px; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .icon-btn { width: 40px; height: 40px; padding: 0 !important; display: inline-flex; align-items: center; justify-content: center; border-radius: 50% !important; font-size: 16px !important; flex: none; }
  .btn.block { width: 100%; padding: 14px; font-size: 15px; }
  svg.i { width: 1em; height: 1em; fill: currentColor; display: block; }

  .muted { color: var(--muted); font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; font-size: 14px; }

  .list-item {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 14px; margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .list-item .meta { min-width: 0; }
  .list-item .name { font-weight: 700; font-size: 15px; }
  .list-item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Programs list */
  .prog { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 14px 14px 16px; margin-top: 10px; cursor: pointer; transition: border-color .15s; }
  .prog:hover { border-color: var(--surface-3); }
  .prog .name { font-weight: 700; font-size: 16px; letter-spacing: -.2px; }
  .prog .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .prog .badge { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent-2); background: rgba(61,220,151,.12); padding: 1px 8px; border-radius: 999px; margin-top: 6px; }
  .play-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent-2); color: #062418; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; flex: none; transition: transform .1s; }
  .play-btn:active { transform: scale(.94); }
  .tile { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; cursor: pointer; }
  .tile .tile-ico { width: 40px; height: 40px; border-radius: 12px; background: rgba(91,140,255,.15); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .tile .name { font-weight: 700; font-size: 15px; display: block; }
  .tile .sub { font-size: 13px; color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
  .tile .sub.live { color: var(--accent-2); }
  .tile .chev { color: var(--muted); font-size: 22px; }

  /* Full-screen overlays */
  .runner {
    position: fixed; inset: 0; background: var(--bg); z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px);
  }
  .runner-top { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: calc(var(--safe-t) + 12px) 16px 0; }
  .runner-top .icon-btn { background: var(--surface-2); border: 0; font-size: 18px !important; }
  .runner .stage { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .runner .phase-name { font-size: 32px; font-weight: 800; letter-spacing: -.5px; line-height: 1.15; margin-bottom: 6px; }
  .runner .time-circle {
    position: relative;
    width: min(76vw, 50vh, 360px); aspect-ratio: 1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 18px auto 16px; background: var(--surface-2);
    transition: background-color .25s linear;
  }
  .runner .ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
  .runner .ring-track { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 2.6; }
  .runner .ring-overall { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .25s linear; }
  .runner .ring-set { fill: none; stroke-width: 2.2; opacity: .85; transition: r .25s linear, stroke .25s linear; }
  .runner .time { position: relative; z-index: 1; font-size: clamp(56px, 18vw, 100px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -2px; transition: color .25s linear; }
  .runner .upnext { color: var(--muted); font-size: 15px; min-height: 22px; }
  .runner .upnext b { color: var(--text); font-weight: 600; }
  .controls { display: flex; gap: 22px; margin-top: 28px; justify-content: center; align-items: center; }
  .round { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--text); display: inline-flex; align-items: center; justify-content: center; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform .1s; flex: none; }
  .round:active { transform: scale(.94); }
  .round.big { width: 84px; height: 84px; font-size: 30px; background: var(--text); color: var(--bg); }
  .round.big.go { background: var(--accent-2); color: #062418; }
  .round.hidden { visibility: hidden; }
  .pill-btn { border-radius: 999px !important; padding: 16px 40px !important; font-size: 17px !important; }
  .done-screen .big { font-size: 40px; font-weight: 800; letter-spacing: -.5px; }
  .done-screen .check-big { width: 88px; height: 88px; border-radius: 50%; background: rgba(61,220,151,.15); color: var(--accent-2); display: flex; align-items: center; justify-content: center; font-size: 44px; margin: 0 auto 18px; }

  /* Calendar */
  .stat-row { display: flex; gap: 10px; margin-top: 12px; }
  .stat { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 8px; text-align: center; }
  .stat .n { font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -.5px; }
  .stat .l { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-head strong { font-size: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 700; padding-bottom: 4px; }
  .cal-cell {
    aspect-ratio: 1; border: 1.5px solid transparent; border-radius: 10px; background: rgba(255,255,255,.025);
    font-size: 13px; color: var(--muted); position: relative; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
  }
  .cal-cell.has { background: var(--surface-3); color: var(--text); font-weight: 700; }
  .cal-cell.today { color: var(--accent); font-weight: 800; }
  .cal-cell.selected { border-color: var(--accent); }
  .cal-cell:not(.empty) { cursor: pointer; }
  .cal-cell.empty { background: transparent; padding: 0; }
  .cal-cell .dots { position: absolute; bottom: 12%; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
  .cal-cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-2); }
  .legend { font-size: 12px; color: var(--muted); margin-top: 12px; display: flex; align-items: center; gap: 6px; }
  .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  /* Program editor */
  .entry { background: var(--bg); border: 1px solid var(--border); border-radius: 14px; padding: 10px; margin-top: 10px; }
  .entry-head { display: flex; align-items: center; gap: 8px; }
  .entry-head .num { min-width: 22px; color: var(--muted); font-weight: 700; }
  .entry-head .sets { width: 56px; flex: none; text-align: center; }
  .phase-row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .phase-row .secs { width: 72px; flex: none; }
  .entry-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .chip-btns { display: flex; gap: 6px; }
  @media (max-width: 560px){
    /* 16px stops iOS from zooming on focus; bigger tap targets in the editors */
    input, select, textarea { font-size: 16px; }
    .chip-btns .btn, .subtabs button, .phase-row .btn { min-height: 40px; min-width: 44px; }
    .editor-actions .btn { flex: 1; padding: 13px; }
    textarea.code { font-size: 15px; }
  }
  details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
  hr.sep { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }

  .resume-banner { display: flex; align-items: center; gap: 12px; cursor: pointer; border-color: rgba(61,220,151,.4); background: linear-gradient(0deg, rgba(61,220,151,.06), rgba(61,220,151,.06)), var(--surface); }
  .resume-banner .name { font-weight: 700; font-size: 15px; }
  .resume-banner .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Sub-screens (session, editor, settings, stopwatch) */
  .sessionscreen { align-items: stretch; justify-content: flex-start; overflow-y: auto; text-align: left; padding: 0; }
  .session-inner { width: 100%; max-width: 560px; margin: 0 auto; padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 60px); }
  .session-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; min-height: 40px; }
  .back-btn { background: none; border: 0; color: var(--accent); font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; padding: 8px 8px 8px 0; display: inline-flex; align-items: center; gap: 2px; }
  .back-btn::before { content: '‹'; font-size: 26px; line-height: 0; margin-top: -3px; margin-right: 4px; }
  .session-title { font-size: 30px; font-weight: 800; letter-spacing: -.6px; line-height: 1.15; margin-bottom: 6px; }
  .ex-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 12px 12px 14px; margin-top: 8px; cursor: pointer; transition: border-color .15s, opacity .15s; }
  .ex-item.done { opacity: .55; }
  .ex-item.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); opacity: 1; }
  .ex-item .ex-num { width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; }
  .ex-item.done .ex-num { background: var(--accent-2); color: #062418; }
  .ex-item .name { font-weight: 700; font-size: 15px; }
  .ex-item .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ex-item .ex-btn { width: 40px; height: 40px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .setting-range { margin-top: 14px; }
  .setting-range label { display: flex; justify-content: space-between; }
  .setting-range input[type=range] { padding: 0; border: 0; background: transparent; accent-color: var(--accent); }
  .btn.ghost.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }

  /* Stopwatch */
  .sw-time { font-size: clamp(60px, 20vw, 110px); font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; margin: 48px 0 8px; line-height: 1; letter-spacing: -2px; }
  .sw-time small { font-size: .38em; color: var(--muted); letter-spacing: 0; }
  .sw-laps { margin-top: 24px; }
  .sw-lap { display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; font-size: 15px; }
</style>
</head>
<body>
<div class="app" x-data="app()" x-init="init()">

  <header>
    <div style="display:flex;align-items:baseline;gap:8px">
      <h1>Interval<span>·</span>Timer</h1>
      <span class="version" x-text="'v'+version"></span>
    </div>
    <button class="btn icon-btn" style="font-size:22px !important" @click="showSettings=true" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
  </header>

  <nav>
    <button :class="{active: tab==='programs'}" @click="tab='programs'">Programs</button>
    <button :class="{active: tab==='calendar'}" @click="tab='calendar'">Calendar</button>
  </nav>

  <!-- ===== Active-session resume banner ===== -->
  <template x-if="session && !showSession && !run.active">
    <div class="card resume-banner" @click="resumeSession()">
      <div class="grow">
        <div class="name" x-text="session.name"></div>
        <div class="sub" x-text="sessionDoneCount()+' of '+session.entries.length+' exercises done'"></div>
      </div>
      <button class="play-btn" @click.stop="resumeSession()" aria-label="Resume"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
    </div>
  </template>

  <template x-if="sw.startTs && !showStopwatch && tab!=='programs'">
    <div class="card resume-banner" @click="openStopwatch()">
      <div class="grow">
        <div class="name">Stopwatch</div>
        <div class="sub" style="font-variant-numeric:tabular-nums" x-text="'Running · '+fmtStopwatch(swNow)"></div>
      </div>
    </div>
  </template>

  <!-- ============ PROGRAMS TAB ============ -->
  <template x-if="tab==='programs'">
    <div>
      <button class="tile" @click="openStopwatch()">
        <span class="tile-ico"><svg class="i" viewBox="0 0 24 24"><path d="M9 1.5h6v2H9zM12 5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zm0 2a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zm-1 2v5.4l3.8 2.3 1-1.7-2.8-1.7V9z"/><path d="M18.3 4.9l1.4-1.4 1.8 1.8-1.4 1.4z"/></svg></span>
        <span class="grow">
          <span class="name">Stopwatch</span>
          <span class="sub" :class="{live: sw.startTs}" x-text="sw.startTs ? 'Running · '+fmtStopwatch(swNow) : (sw.base ? 'Paused · '+fmtStopwatch(sw.base) : 'Time an ad hoc session')"></span>
        </span>
        <span class="chev">›</span>
      </button>

      <div class="section-head">
        <h2>Programs</h2>
        <button class="btn primary sm" @click="newProgram()">+ New</button>
      </div>
      <template x-if="programs.length===0"><div class="card empty">No programs yet. Tap “+ New” to create one.</div></template>
      <template x-for="p in programs" :key="p.id">
        <div class="prog" @click="openProgram(p)">
          <div class="grow" style="min-width:0">
            <div class="name" x-text="p.name"></div>
            <div class="sub" x-text="plural(p.entries.length,'exercise')+' · '+fmt(programDuration(p.entries, p.breakSeconds))+(completionCount(p.id) ? ' · '+completionCount(p.id)+'× done' : '')"></div>
            <span class="badge" x-show="session && session.programId===p.id && sessionDoneCount()">In progress</span>
          </div>
          <button class="btn icon-btn" @click.stop="editProgram(p)" aria-label="Edit program"><svg class="i" viewBox="0 0 24 24"><path d="M4 17.25V20h2.75L17.8 8.94l-2.75-2.75L4 17.25zm15.7-10.2a1 1 0 0 0 0-1.42l-1.33-1.33a1 1 0 0 0-1.42 0l-1.1 1.1 2.75 2.75 1.1-1.1z"/></svg></button>
          <button class="play-btn" @click.stop="openProgram(p)" aria-label="Open program"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
        </div>
      </template>
    </div>
  </template>

  <!-- ============ CALENDAR TAB ============ -->
  <template x-if="tab==='calendar'">
    <div>
      <div class="stat-row">
        <div class="stat"><div class="n" x-text="totalSessions()"></div><div class="l">Sessions</div></div>
        <div class="stat"><div class="n" x-text="currentStreak()"></div><div class="l">Day streak</div></div>
        <div class="stat"><div class="n" x-text="thisMonthCount()"></div><div class="l">This month</div></div>
      </div>

      <div class="card">
        <div class="cal-head">
          <button class="btn icon-btn" @click="calShift(-1)" aria-label="Previous month">‹</button>
          <strong x-text="calLabel()"></strong>
          <button class="btn icon-btn" @click="calShift(1)" aria-label="Next month">›</button>
        </div>
        <div class="cal-grid">
          <template x-for="d in ['Mo','Tu','We','Th','Fr','Sa','Su']" :key="d">
            <div class="cal-dow" x-text="d"></div>
          </template>
          <template x-for="(cell,i) in calCells()" :key="i">
            <div class="cal-cell" :class="{empty: !cell, today: cell && cell.isToday, has: cell && (cell.sessions.length || cell.hasPending), selected: cell && cell.key===cal.selected}" @click="cell && calSelectDay(cell.key)">
              <template x-if="cell">
                <div>
                  <span x-text="cell.day"></span>
                  <div class="dots">
                    <template x-for="(s,si) in cell.sessions.slice(0,3)" :key="si">
                      <span class="dot" :style="isPartialLog(s)?'background:var(--warn)':''" :title="s.name"></span>
                    </template>
                    <span x-show="cell.hasPending" class="dot" style="background:var(--warn)" title="In progress"></span>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
        <div class="legend">
          <i style="background:var(--accent-2)"></i> completed &nbsp;
          <i style="background:var(--warn)"></i> partial / in progress
        </div>
      </div>

      <div class="card">
        <template x-if="cal.selected">
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <h2 style="margin:0" x-text="calSelectedLabel()"></h2>
              <button class="btn icon-btn" @click="cal.selected=null" aria-label="Clear selection">✕</button>
            </div>
            <template x-if="calSelectedItems().length===0"><div class="empty">No sessions on this day.</div></template>
            <template x-for="s in calSelectedItems()" :key="s.ts">
              <div>
                <div class="list-item" :style="((s.pending||isPartialLog(s))?'border-color:var(--warn);':'')+(calDetail===s.ts?'border-radius:12px 12px 0 0;border-bottom-color:transparent;':'')" style="cursor:pointer" @click="calToggleDetail(s.ts)">
                  <div class="meta grow">
                    <div class="name" style="display:flex;align-items:center;gap:6px">
                      <span x-show="s.pending||isPartialLog(s)" style="width:8px;height:8px;border-radius:50%;background:var(--warn);flex-shrink:0;display:inline-block"></span>
                      <span x-text="s.name"></span>
                    </div>
                    <div class="sub">
                      <span x-text="fmtWhen(s.ts)+(s.seconds?' · '+fmt(s.seconds):'')"></span>
                      <span x-show="s.pending" style="color:var(--warn);margin-left:6px">· In progress</span>
                      <span x-show="!s.pending && isPartialLog(s)" style="color:var(--warn);margin-left:6px">· Partial</span>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                    <button x-show="s.pending" class="btn green sm" @click.stop="resumeSession()" style="white-space:nowrap">▶ Resume</button>
                    <button x-show="!s.pending" class="btn danger sm" @click.stop="confirm('Delete this session from the log?') && deleteLog(s.ts)" aria-label="Delete">✕</button>
                    <span x-show="calSessionTimers(s).length>0" class="muted" style="font-size:11px" x-text="calDetail===s.ts?'▲':'▼'"></span>
                  </div>
                </div>
                <div x-show="calDetail===s.ts && calSessionTimers(s).length>0" style="background:var(--surface-2);border:1px solid var(--border);border-top:0;border-radius:0 0 12px 12px;padding:8px 14px;margin-bottom:0">
                  <template x-for="(tr,ti) in calSessionTimers(s)" :key="ti">
                    <div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
                      <span :style="'width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;background:'+(tr.done?'var(--accent-2)':'var(--surface)')">
                        <span x-text="tr.done?'✓':'○'" :style="tr.done?'color:#08221a':'color:var(--muted)'"></span>
                      </span>
                      <span x-text="tr.name" :style="tr.done?'':'color:var(--muted)'"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="!cal.selected">
          <div>
            <h2>Recent sessions</h2>
            <template x-if="log.length===0"><div class="empty">Complete a program to see it here.</div></template>
            <template x-for="s in recentLog()" :key="s.ts">
              <div>
                <div class="list-item" :style="calDetail===s.ts?'border-radius:12px 12px 0 0;border-bottom-color:transparent;':''" style="cursor:pointer" @click="calToggleDetail(s.ts)">
                  <div class="meta grow">
                    <div class="name" x-text="s.name"></div>
                    <div class="sub" x-text="fmtWhen(s.ts)+(s.seconds?' · '+fmt(s.seconds):'')"></div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
                    <button class="btn danger sm" @click.stop="confirm('Delete this session from the log?') && deleteLog(s.ts)" aria-label="Delete">✕</button>
                    <span x-show="calSessionTimers(s).length>0" class="muted" style="font-size:11px" x-text="calDetail===s.ts?'▲':'▼'"></span>
                  </div>
                </div>
                <div x-show="calDetail===s.ts && calSessionTimers(s).length>0" style="background:var(--surface-2);border:1px solid var(--border);border-top:0;border-radius:0 0 12px 12px;padding:8px 14px">
                  <template x-for="(tr,ti) in calSessionTimers(s)" :key="ti">
                    <div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px">
                      <span :style="'width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;background:'+(tr.done?'var(--accent-2)':'var(--surface)')">
                        <span x-text="tr.done?'✓':'○'" :style="tr.done?'color:#08221a':'color:var(--muted)'"></span>
                      </span>
                      <span x-text="tr.name" :style="tr.done?'':'color:var(--muted)'"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </template>
      </div>
    </div>
  </template>

  <!-- ============ PROGRAM EDITOR SCREEN ============ -->
  <template x-if="showEditor">
    <div class="runner sessionscreen">
      <div class="session-inner">
        <div class="session-top">
          <button class="back-btn" @click="closeEditor()">Back</button>
        </div>
        <h2 class="session-title" style="margin-bottom:14px" x-text="editingProgram ? 'Edit program' : 'New program'"></h2>
        <label>Program name</label>
        <input x-model="pForm.name" placeholder="e.g. Morning Routine">

        <div class="subtabs">
          <button :class="{active:pMode==='visual'}" @click="setPMode('visual')">Visual</button>
          <button :class="{active:pMode==='code'}" @click="setPMode('code')">Code</button>
        </div>

        <template x-if="pMode==='visual'"><div>
          <label>Quick add (e.g. “60s Hip Stretches” or “5x 10s Tense, 5s Relax”)</label>
          <div class="row">
            <input class="grow" x-model="pQuick" @keydown.enter.prevent="quickAdd()" placeholder="60s Hip Stretches" autocapitalize="sentences">
            <button class="btn primary" @click="quickAdd()" :disabled="!pQuick.trim()">Add</button>
          </div>
          <div style="color:var(--danger);margin-top:6px;font-size:13px" x-show="pQuickErr" x-text="pQuickErr"></div>

          <template x-if="pForm.entries.length===0"><div class="muted" style="margin-top:10px">No exercises yet.</div></template>
          <template x-for="(e, idx) in pForm.entries" :key="idx">
            <div class="entry">
              <div class="entry-head">
                <span class="num" x-text="(idx+1)+'.'"></span>
                <input class="grow" x-model="e.name" :placeholder="autoTitle(e)||'Exercise name'" style="padding:6px 9px">
                <input class="sets" type="number" inputmode="numeric" min="1" x-model.number="e.sets" title="Sets" aria-label="Sets" style="padding:6px 4px">
                <span class="muted" style="font-size:12px">sets</span>
              </div>
              <template x-for="(ph, pi) in e.phases" :key="pi">
                <div class="phase-row">
                  <input class="secs" type="number" inputmode="decimal" min="0" step="1" x-model.number="ph.seconds" style="padding:6px 8px">
                  <span class="muted" style="font-size:12px">s</span>
                  <input class="grow" x-model="ph.name" placeholder="Phase name" style="padding:6px 9px">
                  <button class="btn ghost sm icon" style="color:var(--muted)" x-show="e.phases.length>1" @click="e.phases.splice(pi,1)" aria-label="Remove phase">✕</button>
                </div>
              </template>
              <div class="entry-foot">
                <div class="row" style="gap:6px">
                  <button class="btn ghost sm" @click="e.phases.push({name:'Rest',seconds:10,color:''})">+ Phase</button>
                  <span class="muted" style="font-size:12px" x-text="fmt(timerDuration(e))"></span>
                </div>
                <div class="chip-btns">
                  <button class="btn sm icon" @click="moveEntry(idx,-1)" :disabled="idx===0" aria-label="Move up">↑</button>
                  <button class="btn sm icon" @click="moveEntry(idx,1)" :disabled="idx===pForm.entries.length-1" aria-label="Move down">↓</button>
                  <button class="btn danger sm icon" @click="pForm.entries.splice(idx,1)" aria-label="Remove">✕</button>
                </div>
              </div>
            </div>
          </template>
          <button class="btn ghost" style="margin-top:10px;width:100%" @click="pForm.entries.push({name:'',sets:1,phases:[{name:'',seconds:30,color:''}]})">+ Add exercise</button>
        </div></template>

        <template x-if="pMode==='code'"><div>
          <label>One exercise per line: <code>60s Hip Stretches</code>, <code>1m30s Plank</code>. Repeat phases with sets: <code>5x 10s Tense, 5s Relax</code>. Optional title: <code>Holds: 5x 10s Tense, 5s Relax</code>. Lines starting with # are ignored.</label>
          <textarea class="code" x-model="pCode" rows="10" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="60s Hip Stretches&#10;30s Overhead Triceps&#10;5x 10s Tense, 5s Relax"></textarea>
          <div style="color:var(--danger);margin-top:8px;white-space:pre-line" x-show="pErrors.length" x-text="pErrors.join('\n')"></div>
        </div></template>

        <hr class="sep">
        <div>
          <label>Break between exercises (seconds, 0 = none)</label>
          <input type="number" inputmode="numeric" min="0" step="5" x-model.number="pForm.breakSeconds" style="max-width:140px">
        </div>

        <div class="muted" style="margin-top:12px" x-show="pMode==='visual' && pForm.entries.length">
          Total program: <strong x-text="fmt(programDuration(pForm.entries, pForm.breakSeconds))"></strong>
        </div>

        <div class="row editor-actions" style="margin-top:14px">
          <button class="btn primary" @click="saveProgram()" :disabled="!pForm.name || (pMode==='visual' ? !pForm.entries.length : !pCode.trim())">Save program</button>
          <button class="btn ghost" @click="closeEditor()">Cancel</button>
        </div>
        <template x-if="editingProgram">
          <button class="btn danger" style="margin-top:28px;width:100%" @click="deleteFromEditor()">Delete program</button>
        </template>
      </div>
    </div>
  </template>

  <!-- ============ SETTINGS SCREEN ============ -->
  <template x-if="showSettings">
    <div class="runner sessionscreen">
      <div class="session-inner">
        <div class="session-top">
          <button class="back-btn" @click="showSettings=false; hush()">Back</button>
        </div>
        <h2 class="session-title" style="margin-bottom:14px">Settings</h2>

        <div class="card">
          <h2>Your data</h2>
          <div class="muted" style="margin-bottom:12px">Programs and history live only on this device. Export a backup or move them to another device.</div>
          <div class="row">
            <button class="btn" @click="exportData()">Export</button>
            <button class="btn" @click="$refs.importInput.click()">Import</button>
            <input type="file" accept="application/json,.json" x-ref="importInput" style="display:none" @change="importData($event)">
          </div>
        </div>

        <div class="card" x-show="audioSessionSupported()">
          <h2>Other audio</h2>
          <label>When a podcast or music is playing</label>
          <select x-model="settings.audioMix" @change="saveSettings(); applyAudioSession(); testVoice()">
            <option value="ambient">Mix with it</option>
            <option value="transient">Lower it briefly</option>
            <option value="auto">Let iOS decide (may pause it)</option>
          </select>
          <div class="muted" style="margin-top:8px">If your podcast still stops, try another option. Voice is the usual culprit: beeps alone don't stop other audio.</div>
        </div>

        <div class="card">
          <h2>Sounds</h2>
          <label class="check"><input type="checkbox" x-model="settings.clicks" @change="saveSettings()"> Click sounds when a phase changes</label>
          <div class="muted" style="margin-top:6px">iPhones can't vibrate from a web app, so the app plays short clicks instead. Countdown beeps aren't affected.</div>
        </div>

        <div class="card">
          <h2>Voice announcements</h2>
          <template x-if="!speechSupported()"><div class="muted">This browser can't speak.</div></template>
          <template x-if="speechSupported()"><div>
            <label class="check"><input type="checkbox" x-model="settings.voice" @change="saveSettings()"> Speak phases during a run</label>
            <div :style="settings.voice ? '' : 'opacity:.5;pointer-events:none'">
              <hr class="sep">
              <label>Voice</label>
              <select x-model="settings.voiceURI" @change="saveSettings(); testVoice()">
                <option value="">System default</option>
                <template x-for="v in voices" :key="v.uri">
                  <option :value="v.uri" :selected="v.uri===settings.voiceURI" x-text="v.name+' ('+v.lang+')'"></option>
                </template>
              </select>

              <div class="setting-range">
                <label>Speed <span x-text="(+settings.rate).toFixed(2)+'×'"></span></label>
                <input type="range" min="0.6" max="1.6" step="0.05" x-model.number="settings.rate" @change="saveSettings(); testVoice()">
              </div>
              <div class="setting-range">
                <label>Pitch <span x-text="(+settings.pitch).toFixed(2)"></span></label>
                <input type="range" min="0.5" max="1.5" step="0.05" x-model.number="settings.pitch" @change="saveSettings(); testVoice()">
              </div>
              <div class="setting-range">
                <label>Volume <span x-text="Math.round(settings.volume*100)+'%'"></span></label>
                <input type="range" min="0.1" max="1" step="0.05" x-model.number="settings.volume" @change="saveSettings(); testVoice()">
              </div>

              <hr class="sep">
              <label class="check"><input type="checkbox" x-model="settings.heads" @change="saveSettings()"> Announce the next phase a few seconds early</label>
              <label class="check" style="margin-top:10px"><input type="checkbox" x-model="settings.durations" @change="saveSettings()"> Include how long the next phase is</label>

              <button class="btn ghost" style="margin-top:14px" @click="testVoice()">▶ Test voice</button>
            </div>
          </div></template>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ STOPWATCH SCREEN ============ -->
  <template x-if="showStopwatch">
    <div class="runner sessionscreen">
      <div class="session-inner">
        <div class="session-top">
          <button class="back-btn" @click="closeStopwatch()">Back</button>
        </div>
        <h2 class="session-title" style="text-align:center">Stopwatch</h2>
        <div class="sw-time" x-html="fmtStopwatch(swNow, true)"></div>
        <div class="controls">
          <button class="round" :class="{hidden: sw.startTs || !swNow}" @click="swReset()">Reset</button>
          <button class="round big" :class="{go: !sw.startTs}" @click="swToggle()" :aria-label="sw.startTs ? 'Pause' : 'Start'">
            <span x-show="!sw.startTs"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span><span x-show="sw.startTs"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg></span>
          </button>
          <button class="round" :class="{hidden: !sw.startTs}" @click="swLap()">Lap</button>
        </div>
        <template x-if="!sw.startTs && swNow">
          <div class="card" style="margin-top:32px">
            <label>Log this session as</label>
            <div class="row">
              <input class="grow" x-model="sw.name" placeholder="Stopwatch" @change="swSave()">
              <button class="btn green" @click="swLog()">Log it</button>
            </div>
          </div>
        </template>
        <div class="sw-laps" x-show="sw.laps.length">
          <template x-for="(l,i) in [...sw.laps].reverse()" :key="i">
            <div class="sw-lap">
              <span class="muted" x-text="'Lap '+(sw.laps.length-i)"></span>
              <span x-text="fmtStopwatch(l-(sw.laps[sw.laps.length-i-2]||0))"></span>
              <span class="muted" x-text="fmtStopwatch(l)"></span>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ PROGRAM SESSION SCREEN ============ -->
  <template x-if="session && showSession && !run.active">
    <div class="runner sessionscreen">
      <div class="session-inner">
        <div class="session-top">
          <button class="back-btn" @click="minimizeSession()">Back</button>
          <span class="muted" x-text="sessionDoneCount()+' / '+session.entries.length"></span>
        </div>
        <h2 class="session-title" x-text="session.name"></h2>
        <div class="muted" style="margin-bottom:14px">Tap an exercise to choose where to start, or ▶ to run just that one.</div>
        <template x-if="!sessionAllDone()">
          <button class="btn green block" style="margin-bottom:6px" @click="startFromSelected()"
            x-text="sessionDoneCount() ? 'Continue from '+entryTitle(session.entries[selEx]) : 'Start from '+entryTitle(session.entries[selEx])"></button>
        </template>

        <template x-for="(t, i) in session.entries" :key="i">
          <div class="ex-item" :class="{done: session.exDone[i], selected: selEx===i}" @click="selEx=i">
            <div class="ex-num" x-text="session.exDone[i] ? '✓' : (i+1)"></div>
            <div class="grow">
              <div class="name" x-text="entryTitle(t)"></div>
              <div class="sub" x-text="entryLine(t, false)+' · '+fmt(timerDuration(t))"></div>
            </div>
            <button class="btn ex-btn" @click.stop="toggleExDone(i)" :title="session.exDone[i] ? 'Mark as not done' : 'Mark as done without running'" :aria-label="session.exDone[i] ? 'Mark as not done' : 'Mark as done'" x-text="session.exDone[i] ? '↺' : '✓'"></button>
            <button class="btn green ex-btn" @click.stop="startExercise(i)" :title="'Run only '+entryTitle(t)" aria-label="Run only this exercise"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></button>
          </div>
        </template>

        <template x-if="sessionAllDone()">
          <div class="card" style="margin-top:16px;text-align:center">
            <div style="font-size:20px;font-weight:800">🎉 All exercises done!</div>
            <button class="btn green" style="margin-top:12px" @click="finishSession()">Finish &amp; log it</button>
          </div>
        </template>

        <template x-if="!sessionAllDone() && sessionDoneCount() > 0">
          <div style="margin-top:16px;text-align:center">
            <button class="btn ghost sm" @click="logPartialSession()">Log what's done so far</button>
          </div>
        </template>

        <div style="margin-top:28px;text-align:center">
          <button class="btn danger ghost sm"
            @click="confirmId==='session' ? abandonSession() : confirmId='session'"
            @mouseleave="confirmId=null"
            x-text="confirmId==='session' ? 'Sure? Discard progress' : 'Abandon program'"></button>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ INTERVAL RUNNER OVERLAY ============ -->
  <template x-if="run.active">
    <div class="runner" :class="run.kind">
      <template x-if="!run.finished">
        <div class="timer-content" style="width:100%; max-width:480px">
          <div class="runner-top">
            <button class="btn icon-btn" @click="exitRun()" :aria-label="run.returnTo==='session' ? 'Back to program' : 'Stop'">✕</button>
            <span class="muted" style="font-weight:600;font-variant-numeric:tabular-nums" x-show="run.totalSets>1 && run.setNum>0" x-text="'Set '+run.setNum+' of '+run.totalSets"></span>
            <button class="btn icon-btn" @click="toggleVoice()" :aria-label="settings.voice ? 'Mute voice' : 'Unmute voice'"><span x-show="settings.voice"><svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span><span x-show="!settings.voice"><svg class="i" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></span></button>
          </div>
          <div class="stage" x-text="run.contextLabel"></div>
          <div class="phase-name" x-text="run.phaseName"></div>
          <div class="time-circle" :style="circleStyle()">
            <svg class="ring-svg" viewBox="0 0 100 100">
              <circle class="ring-track" cx="50" cy="50" r="47"></circle>
              <circle class="ring-overall" cx="50" cy="50" r="47" :style="overallRingStyle()"></circle>
              <circle class="ring-set" cx="50" cy="50" :r="setRingRadius()" :style="setRingStyle()" x-show="run.totalSets>1"></circle>
            </svg>
            <div class="time" :style="'color:'+contrastColor(run.steps[run.idx].color)+';transition-duration:'+colorAnimMs()+'ms'" x-text="fmtClock(run.remaining, run.steps[run.idx].seconds)"></div>
          </div>
          <div class="upnext"><template x-if="run.upNext"><span>Next: <b x-text="run.upNext"></b></span></template><template x-if="!run.upNext"><b>Last one!</b></template></div>

          <!-- before first start: big Start button -->
          <template x-if="run.idx===0 && run.paused && run.pct===0">
            <div class="controls">
              <button class="btn green pill-btn" @click="startRunFromPrep()">Start</button>
            </div>
          </template>

          <!-- during run -->
          <template x-if="!(run.idx===0 && run.paused && run.pct===0)">
            <div class="controls">
              <span class="round hidden"></span>
              <button class="round big" :class="{go: run.paused}" @click="togglePause()" :aria-label="run.paused ? 'Resume' : 'Pause'">
                <span x-show="run.paused"><svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></span><span x-show="!run.paused"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg></span>
              </button>
              <button class="round" @click="skipPhase()" aria-label="Skip phase" style="font-size:22px"><svg class="i" viewBox="0 0 24 24"><path d="M5 6.2v11.6a.9.9 0 0 0 1.4.75L15 12.75a.9.9 0 0 0 0-1.5L6.4 5.45A.9.9 0 0 0 5 6.2z"/><rect x="16.5" y="5.5" width="2.8" height="13" rx="1"/></svg></button>
            </div>
          </template>
        </div>
      </template>
      <template x-if="run.finished">
        <div class="done-screen">
          <div class="check-big"><svg class="i" viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2l5 5 11-11-1.5-1.5z"/></svg></div>
          <div class="big">Complete</div>
          <div class="muted" style="margin-top:8px" x-text="run.label"></div>
          <button class="btn green pill-btn" style="margin-top:28px" @click="closeRun()"
            x-text="run.returnTo==='session' ? 'Back to program' : 'Done'"></button>
        </div>
      </template>
    </div>
  </template>


</div>

<script>
function app(){
  return {
    tab: 'programs',
    version: '2.6.1',
    timers: [],           // legacy saved timers (pre-2.0), only kept to migrate old data and name old log entries
    programs: [], log: [],
    cal: { y: new Date().getFullYear(), m: new Date().getMonth(), selected: null },

    editingProgram: null, confirmId: null, calDetail: null,
    pForm: { name:'', entries:[], breakSeconds:0 },
    selEx: 0,             // exercise selected on the program overview
    pMode: 'visual', pCode: '', pErrors: [], pQuick: '', pQuickErr: '',

    run: { active:false },
    session: null,        // persistent in-progress program
    showSession: false,   // whether the program-run screen is open
    _tick:null, _audioCtx:null, _wakeLock:null,
    showEditor: false, _editorSnap: '',
    showSettings: false,
    settings: { voice:true, voiceURI:'', rate:1.05, pitch:1, volume:1, heads:true, durations:true, audioMix:'ambient', clicks:true },
    voices: [],           // [{uri,name,lang}] offered in settings
    showStopwatch: false,
    sw: { startTs:null, base:0, laps:[], name:'' }, // elapsed = base + (now - startTs) while running; laps are elapsed ms
    swNow: 0, _swTick:null,

    // ---------- persistence ----------
    init(){
      // wake locks are dropped when the page is hidden; re-acquire on return
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') this._syncWakeLock(); });
      this.timers = this.load('it_timers', []);
      // migrate old format: per-phase sets -> timer-level sets
      let changed=false;
      this.timers.forEach(t=>{
        if(t.sets===undefined){
          const maxSets=Math.max(1,...t.phases.map(p=>p.sets||1));
          t.sets=maxSets;
          t.phases=t.phases.map(p=>({name:p.name,seconds:p.seconds}));
          changed=true;
        }
      });
      this.programs = this.load('it_programs', []);
      this.log = this.load('it_log', []);
      this.session = this.load('it_session', null);
      // migrate 1.x programs (references to saved timers) to inline entries
      this.programs.forEach(p=>{ if(this.migrateProgram(p,this.timers)) changed=true; });
      if(this.session && this.session.timerIds){
        this.session.entries=this.legacyEntries(this.session.timerIds,this.session.labels,this.timers);
        delete this.session.timerIds; delete this.session.labels; this.saveSession();
      }
      if(changed) this.save();
      Object.assign(this.settings, this.load('it_settings', {}));
      if(this.load('it_voice', null)===false && !localStorage.getItem(this._key('it_settings'))) this.settings.voice=false; // 2.3.0 toggle
      this.applyAudioSession();
      Object.assign(this.sw, this.load('it_stopwatch', {}));
      if(this.sw.startTs) this._swStartTick();
      if(this.speechSupported()){ this.loadVoices(); speechSynthesis.addEventListener?.('voiceschanged',()=>this.loadVoices()); }
    },
    // Old programs stored timerIds[] + labels[]; inline a copy of each timer as an entry.
    legacyEntries(ids,labels,timers){
      return (ids||[]).map((id,i)=>{
        const t=timers.find(x=>x.id===id); if(!t) return null;
        const e={name:'',sets:Math.max(1,t.sets||1),phases:t.phases.map(p=>({name:p.name,seconds:p.seconds,color:p.color||''}))};
        const name=((labels&&labels[i])||'').trim()||t.name;
        if(name!==this.autoTitle(e)) e.name=name;
        return e;
      }).filter(Boolean);
    },
    migrateProgram(p,timers){
      if(!p.timerIds) return false;
      p.entries=this.legacyEntries(p.timerIds,p.labels,timers);
      delete p.timerIds; delete p.labels; return true;
    },
    // A copy served under /preview/ keeps its own storage (seeded from the live app's) so trying it can't touch real data.
    _key(k){ return location.pathname.includes('/preview/') ? 'preview_'+k : k },
    load(k,d){
      try{
        const own=localStorage.getItem(this._key(k));
        return JSON.parse(own!==null ? own : localStorage.getItem(k)) ?? d;
      }catch(e){ return d }
    },
    save(){
      localStorage.setItem(this._key('it_timers'), JSON.stringify(this.timers));
      localStorage.setItem(this._key('it_programs'), JSON.stringify(this.programs));
      localStorage.setItem(this._key('it_log'), JSON.stringify(this.log));
    },
    saveSession(){
      if(this.session) localStorage.setItem(this._key('it_session'), JSON.stringify(this.session));
      else localStorage.setItem(this._key('it_session'),'null');
    },
    uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6) },

    // ---------- formatting ----------
    plural(n,word){ return n+' '+word+(n===1?'':'s') },
    // "Today, 18:54" / "Yesterday, 18:54" / "Tue 14 Oct, 18:54" (year added when it isn't this one)
    fmtWhen(ts){
      const d=new Date(ts), now=new Date(), day=x=>this._dateKey(x);
      const y=new Date(now); y.setDate(y.getDate()-1);
      const time=d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
      if(day(d)===day(now)) return 'Today, '+time;
      if(day(d)===day(y)) return 'Yesterday, '+time;
      const opts={weekday:'short',day:'numeric',month:'short'};
      if(d.getFullYear()!==now.getFullYear()) opts.year='numeric';
      return d.toLocaleDateString(undefined,opts)+', '+time;
    },
    fmt(s){ s=Math.round(s); const m=Math.floor(s/60), x=s%60; return m? m+'m '+(x?x+'s':''):x+'s' },
    fmtClock(s, total){
      if(total!==undefined && total<1){ return Math.max(0,s).toFixed(1) }
      s=Math.max(0,Math.ceil(s));
      if(total!==undefined && total<60){ return s }
      const m=Math.floor(s/60), x=s%60; return m+':'+String(x).padStart(2,'0')
    },

    // Adaptive color-fade duration: scales with the phase length so sub-second
    // pulses fade almost instantly while long phases get a smooth transition.
    colorAnimMs(){
      const cur=this.run.steps && this.run.steps[this.run.idx];
      const sec=cur ? cur.seconds : 0;
      return Math.round(Math.min(400, Math.max(0, sec)*400));
    },
    circleStyle(){
      const cur=this.run.steps && this.run.steps[this.run.idx];
      const color=(cur && cur.color) ? cur.color : '';
      return 'transition-duration:'+this.colorAnimMs()+'ms;'+(color ? 'background:'+color : '');
    },
    // Pick black/white text for legible contrast against the circle color.
    contrastColor(hex){
      if(!hex || hex.length<7) return 'var(--text)';
      const r=parseInt(hex.substr(1,2),16), g=parseInt(hex.substr(3,2),16), b=parseInt(hex.substr(5,2),16);
      const L=(0.299*r+0.587*g+0.114*b)/255;
      return L>0.6 ? '#0b0e14' : '#ffffff';
    },
    hexToHsl(hex){
      const r=parseInt(hex.substr(1,2),16)/255, g=parseInt(hex.substr(3,2),16)/255, b=parseInt(hex.substr(5,2),16)/255;
      const max=Math.max(r,g,b), min=Math.min(r,g,b);
      let h=0, s=0; const l=(max+min)/2;
      if(max!==min){
        const d=max-min;
        s = l>0.5 ? d/(2-max-min) : d/(max+min);
        switch(max){
          case r: h=(g-b)/d+(g<b?6:0); break;
          case g: h=(b-r)/d+2; break;
          default: h=(r-g)/d+4;
        }
        h*=60;
      }
      return {h,s:s*100,l:l*100};
    },
    // Neon accent for the progress rings: a hue-rotated, high-saturation pop
    // that reads against whatever the phase's background color is. Plain
    // white when no phase color is set.
    neonAccent(hex){
      if(!hex || hex.length<7) return '#ffffff';
      const {h,l}=this.hexToHsl(hex);
      const hue=(h+180)%360;
      const light = l>55 ? 42 : 68;
      return 'hsl('+hue.toFixed(0)+',95%,'+light+'%)';
    },
    // Overall progress: a ring traced along the background circle's edge.
    overallRingStyle(){
      const c=2*Math.PI*47;
      const pct=this.run.setPct||0;
      const offset=c-(pct/100)*c;
      const cur=this.run.steps && this.run.steps[this.run.idx];
      const color=this.neonAccent(cur && cur.color);
      return 'stroke:'+color+';stroke-dasharray:'+c+';stroke-dashoffset:'+offset+(pct===0?';transition:none':'');
    },
    // Current-set progress: a circle stroke growing from the center out to the circle's edge.
    setRingRadius(){
      const pct=this.run.curSetPct||0;
      return (pct/100*44).toFixed(2);
    },
    setRingStyle(){
      const pct=this.run.curSetPct||0;
      const cur=this.run.steps && this.run.steps[this.run.idx];
      const color=this.neonAccent(cur && cur.color);
      return 'stroke:'+color+(pct===0?';transition:none':'');
    },

    // ---------- timer logic ----------
    roundDuration(t){ return (t.phases||[]).reduce((a,p)=>a+(p.seconds||0),0) },
    timerDuration(t){ return this.roundDuration(t)*Math.max(1,t.sets||1) },
    programDuration(entries,breakSec){ return entries.reduce((a,e)=>a+this.timerDuration(e),0)+Math.max(0,entries.length-1)*Math.max(0,+breakSec||0) },
    // legacy (1.x) log entries reference saved timers by id
    entryName(id,label){ const t=this.timers.find(x=>x.id===id); return (label&&label.trim()) || (t?t.name:'(deleted)') },

    // ---------- program entries ----------
    // An entry is { name, sets, phases:[{name,seconds,color}] }. Empty name -> title derived from phases.
    autoTitle(e){ return [...new Set(e.phases.map(p=>(p.name||'').trim()).filter(Boolean))].join(' / ') },
    entryTitle(e){ return (e.name||'').trim() || this.autoTitle(e) || 'Exercise' },
    // under 2 minutes stays in seconds ("90s"), longer becomes "2m" / "2m30s"
    fmtCompact(sec){ sec=Math.round(sec*10)/10; if(sec<120) return sec+'s'; const m=Math.floor(sec/60), r=Math.round((sec-m*60)*10)/10; return m+'m'+(r?r+'s':''); },
    // "5x 10s Tense, 5s Relax" (withTitle adds "Title: " when the name isn't the derived one)
    entryLine(e,withTitle=true){
      const body=((e.sets||1)>1?e.sets+'x ':'')+e.phases.map(p=>this.fmtCompact(p.seconds)+(p.name?' '+p.name:'')).join(', ');
      const n=(e.name||'').trim();
      return (withTitle && n && n!==this.autoTitle(e) ? n+': ' : '')+body;
    },
    // "90s" / "1m30s" / "1.5m" / "2m" -> seconds, else null
    parseDur(tok){
      const m=/^(?:(\d+(?:\.\d+)?)m(?:in)?)?(?:(\d+(?:\.\d+)?)s(?:ec)?)?$/i.exec(tok);
      if(!m||(!m[1]&&!m[2])) return null;
      const s=(m[1]?+m[1]*60:0)+(m[2]?+m[2]:0);
      return s>0?s:null;
    },
    // "10s Tense" or "Tense 10s" (also "1m 30s Plank")
    parsePhase(str){
      const t=str.trim().split(/\s+/).filter(Boolean);
      const tries=[[2,true],[1,true],[2,false],[1,false]];
      for(const [n,front] of tries){
        if(t.length<n) continue;
        const durToks=front?t.slice(0,n):t.slice(t.length-n);
        const sec=this.parseDur(durToks.join(''));
        if(sec!=null) return {name:(front?t.slice(n):t.slice(0,t.length-n)).join(' '),seconds:sec,color:''};
      }
      return null;
    },
    // one line -> entry, or a string describing the problem
    parseEntryLine(line){
      let title='', body=line.trim();
      const c=body.indexOf(':');
      if(c>0){ const r=this.parseEntryBody(body.slice(c+1)); if(r) { title=body.slice(0,c).trim(); return {...r,name:title}; } }
      return this.parseEntryBody(body) || 'expected e.g. "60s Hip Stretches" or "5x 10s Tense, 5s Relax"';
    },
    parseEntryBody(body){
      let sets=1;
      const m=/^\s*(\d+)\s*[x×]\s+(.*)$/i.exec(body);
      if(m){ sets=+m[1]; body=m[2]; }
      if(sets<1) return null;
      const phases=body.split(',').map(p=>p.trim()).filter(Boolean).map(p=>this.parsePhase(p));
      if(!phases.length||phases.some(p=>!p)) return null;
      return {name:'',sets,phases};
    },
    programToCode(){ return this.pForm.entries.map(e=>this.entryLine(e)).join('\n') },
    // Parses code into {entries, errors}; does not touch state.
    parseProgramCode(code){
      const entries=[], errors=[];
      code.split('\n').forEach((raw,n)=>{
        const line=raw.trim(); if(!line||line.startsWith('#')) return;
        const r=this.parseEntryLine(line);
        if(typeof r==='string') errors.push('Line '+(n+1)+': '+r+' — '+line); else entries.push(r);
      });
      return {entries,errors};
    },
    // Applies pCode to pForm. Phase colours survive when the phase at the same spot keeps its name.
    applyProgramCode(){
      const r=this.parseProgramCode(this.pCode);
      this.pErrors=r.errors;
      if(r.errors.length) return false;
      r.entries.forEach((e,i)=>e.phases.forEach((p,j)=>{
        const old=this.pForm.entries[i]&&this.pForm.entries[i].phases[j];
        if(old&&old.name===p.name) p.color=old.color||'';
      }));
      this.pForm.entries=r.entries;
      return true;
    },
    setPMode(mode){
      if(mode===this.pMode) return;
      if(mode==='code'){ this.pCode=this.programToCode(); this.pErrors=[]; this.pMode='code'; }
      else if(this.applyProgramCode()) this.pMode='visual';
    },
    quickAdd(){
      const lines=this.pQuick.split('\n').map(l=>l.trim()).filter(Boolean);
      const parsed=lines.map(l=>this.parseEntryLine(l));
      const bad=parsed.find(p=>typeof p==='string');
      if(bad){ this.pQuickErr=bad; return; }
      this.pForm.entries.push(...parsed); this.pQuick=''; this.pQuickErr='';
    },
    moveEntry(i,dir){
      const j=i+dir, a=this.pForm.entries; if(j<0||j>=a.length)return;
      [a[i],a[j]]=[a[j],a[i]];
    },
    cleanEntries(entries){
      return entries.map(e=>({
        name:(e.name||'').trim(), sets:Math.max(1,Math.round(+e.sets||1)),
        phases:e.phases.filter(p=>+p.seconds>0).map(p=>({name:(p.name||'').trim(),seconds:+p.seconds,color:p.color||''}))
      })).filter(e=>e.phases.length);
    },
    saveProgram(){
      if(this.pMode==='code' && !this.applyProgramCode()) return;
      const clean={ name:this.pForm.name.trim(), entries:this.cleanEntries(this.pForm.entries),
        breakSeconds:Math.max(0,Math.round(+this.pForm.breakSeconds||0)) };
      if(!clean.name){ alert('Give the program a name'); return; }
      if(!clean.entries.length){ alert('Add at least one exercise with a duration'); return; }
      if(this.editingProgram){ const i=this.programs.findIndex(x=>x.id===this.editingProgram); clean.id=this.editingProgram; this.programs[i]=clean; }
      else { clean.id=this.uid(); this.programs.push(clean); }
      this.save(); this.resetProgramForm(); this.showEditor=false;
    },
    newProgram(){ this.resetProgramForm(); this._openEditor(); },
    editProgram(p){ this.resetProgramForm(); this.editingProgram=p.id; this.pForm={name:p.name,entries:JSON.parse(JSON.stringify(p.entries)),breakSeconds:p.breakSeconds||0}; this._openEditor(); },
    _editorState(){ return JSON.stringify([this.pForm,this.pMode,this.pCode]) },
    _openEditor(){ this._editorSnap=this._editorState(); this.showEditor=true; },
    closeEditor(){
      if(this._editorState()!==this._editorSnap && !confirm('Discard your changes?')) return;
      this.resetProgramForm(); this.showEditor=false;
    },
    deleteProgram(id){ this.programs=this.programs.filter(x=>x.id!==id); this.confirmId=null; this.save(); },
    deleteFromEditor(){
      const p=this.programs.find(x=>x.id===this.editingProgram);
      if(!p || !confirm('Delete "'+p.name+'"? Its history stays in the calendar.')) return;
      this.deleteProgram(p.id); this.resetProgramForm(); this.showEditor=false;
    },
    resetProgramForm(){ this.editingProgram=null; this.pForm={name:'',entries:[],breakSeconds:0}; this.pMode='visual'; this.pCode=''; this.pErrors=[]; this.pQuick=''; this.pQuickErr=''; },

    // ---------- build run steps (single exercise/timer) ----------
    buildSteps(timer,displayName){
      const title=displayName||timer.name;
      const sets=Math.max(1,timer.sets||1);
      const pps=timer.phases.length;
      const steps=[{name:'Get ready',seconds:3,kind:'prep',ctx:title,exTitle:title,setNum:0,phaseInSet:0,phasesPerSet:pps,totalSets:sets,color:''}];
      for(let s=1;s<=sets;s++){
        timer.phases.forEach((ph,i)=>{
          const isRest=/rest|pause|break|relax|recover/i.test(ph.name);
          steps.push({
            name: ph.name||title,
            seconds: ph.seconds,
            kind: isRest?'rest':'work',
            ctx: title+(sets>1?' · set '+s+'/'+sets:''),
            exTitle: title,
            setNum: s,
            phaseInSet: i,
            phasesPerSet: pps,
            totalSets: sets,
            color: ph.color||''
          });
        });
      }
      return steps;
    },

    // ---------- program session ----------
    // Opens the program overview, creating a session for it unless one is already running.
    openProgram(p){
      if(this.session && this.session.programId===p.id){ this.resumeSession(); return; }
      if(!p.entries.length){ alert('This program has no exercises.'); return; }
      if(this.session && this.sessionDoneCount()){
        if(!confirm(`"${this.session.name}" is still in progress. Abandon it and open "${p.name}"?`)) return;
      }
      this.session={
        programId:p.id, name:p.name,
        entries:JSON.parse(JSON.stringify(p.entries)),
        exDone:p.entries.map(()=>false),
        breakSeconds:p.breakSeconds||0,
        startedTs: Date.now(), lastExerciseTs: null
      };
      this.saveSession();
      this.resumeSession();
    },
    resumeSession(){ if(!this.session) return; this.selEx=this.firstOpenEx(); this.showSession=true; },
    firstOpenEx(){ const i=this.session.exDone.findIndex(d=>!d); return i<0?0:i; },
    // back to main app; a session with nothing done yet is just a peek and gets dropped
    minimizeSession(){
      this.showSession=false;
      if(this.session && !this.sessionDoneCount()){ this.session=null; this.saveSession(); }
    },
    toggleExDone(i){
      this.session.exDone[i]=!this.session.exDone[i];
      if(this.session.exDone[i]) this.session.lastExerciseTs=Date.now();
      this.saveSession();
      if(this.session.exDone[this.selEx]) this.selEx=this.firstOpenEx();
    },
    sessionAllDone(){ return this.session && this.session.exDone.length>0 && this.session.exDone.every(Boolean); },
    sessionDoneCount(){ return this.session? this.session.exDone.filter(Boolean).length : 0; },
    logPartialSession(){
      const ts=this.session.lastExerciseTs||Date.now();
      this.log.push({ ts, programId:this.session.programId, name:this.session.name, date:this._dateKey(new Date(ts)), exDone:[...this.session.exDone], names:this.session.entries.map(e=>this.entryTitle(e)) });
      this.save();
      this.session=null; this.saveSession(); this.showSession=false;
    },

    // Runs just this one exercise; it is marked done when it finishes.
    startExercise(i){
      const t=this.session.entries[i];
      if(!t)return;
      if(!this.sessionDoneCount()) this.session.startedTs=Date.now();
      const name=this.entryTitle(t);
      const steps=this.buildSteps(t,name);
      this.run={
        active:true, finished:false, paused:true, returnTo:'session',
        steps, idx:0, remaining:steps[0].seconds,
        kind:steps[0].kind, phaseName:steps[0].name, contextLabel:steps[0].ctx,
        upNext: this.upNextLabel(steps,0), pct:0, setPct:0, curSetPct:0,
        setNum:0, totalSets:Math.max(1,t.sets||1),
        label: name, logOnFinish:false, programId:this.session.programId, exIndex:i
      };
      this._startTick();
    },

    // Runs the selected exercise, then every not-yet-done one after it, back to back with
    // optional breaks in between. Each exercise is marked done as soon as its last step completes.
    startFromSelected(){
      const sel=this.selEx;
      const todo=this.session.entries.map((e,i)=>i).filter(i=>i===sel || (i>sel && !this.session.exDone[i]));
      if(!todo.length) return;
      if(!this.sessionDoneCount()) this.session.startedTs=Date.now();
      const brk=this.session.breakSeconds||0;
      const steps=[];
      todo.forEach((i,k)=>{
        const t=this.session.entries[i];
        const name=this.entryTitle(t);
        const ex=this.buildSteps(t,name).slice(k===0?0:1).map(st=>({...st,exIndex:i}));
        ex[ex.length-1].lastOfEx=true;
        if(k>0 && brk>0){
          steps.push({name:'Break',seconds:brk,kind:'rest',ctx:'Up next: '+name,setNum:0,phaseInSet:0,phasesPerSet:0,totalSets:1,color:''});
        }
        steps.push(...ex);
      });
      const t0=this.session.entries[todo[0]];
      this.run={
        active:true, finished:false, paused:true, returnTo:'session',
        steps, idx:0, remaining:steps[0].seconds,
        kind:steps[0].kind, phaseName:steps[0].name, contextLabel:steps[0].ctx,
        upNext: this.upNextLabel(steps,0), pct:0, setPct:0, curSetPct:0,
        setNum:0, totalSets:Math.max(1,t0.sets||1),
        label: this.session.name, logOnFinish:false, programId:this.session.programId, exIndex:null
      };
      this._startTick();
    },

    finishSession(){
      if(this.sessionAllDone()){
        const ts=this.session.lastExerciseTs||Date.now();
        this.log.push({ ts, programId:this.session.programId, name:this.session.name, date:this._dateKey(new Date(ts)) });
        this.save();
      }
      this.session=null; this.saveSession(); this.showSession=false;
    },
    abandonSession(){ this.session=null; this.saveSession(); this.showSession=false; this.confirmId=null; },

    // ---------- interval ticking ----------
    // keep the screen on while a timer is actively running
    async _syncWakeLock(){
      const want=!!(this.run && this.run.active && !this.run.paused && !this.run.finished) || !!(this.showStopwatch && this.sw.startTs);
      try{
        if(want && !this._wakeLock && 'wakeLock' in navigator && document.visibilityState==='visible'){
          const lock=await navigator.wakeLock.request('screen');
          this._wakeLock=lock;
          lock.addEventListener('release',()=>{ if(this._wakeLock===lock) this._wakeLock=null; });
          if(!(this.run && this.run.active && !this.run.paused && !this.run.finished) && !(this.showStopwatch && this.sw.startTs)) this._syncWakeLock();
        } else if(!want && this._wakeLock){
          const l=this._wakeLock; this._wakeLock=null; await l.release();
        }
      }catch(e){ /* unsupported or denied: ignore */ }
    },
    _startTick(){
      clearInterval(this._tick);
      let last=performance.now();
      this._tick=setInterval(()=>{
        if(this.run.paused){ last=performance.now(); return; }
        const now=performance.now(), dt=(now-last)/1000; last=now;
        this.run.remaining-=dt;
        const cur=this.run.steps[this.run.idx];
        this.run.pct=Math.min(100,(1-this.run.remaining/cur.seconds)*100);
        const sn=cur.setNum, pip=cur.phaseInSet, pps=cur.phasesPerSet, ts=this.run.totalSets;
        if(sn>0 && pps>0 && ts>0){
          this.run.setPct=Math.min(100,((sn-1)*pps+pip+(1-this.run.remaining/cur.seconds))/(ts*pps)*100);
        }
        if(sn>0 && pps>0){
          this.run.curSetPct=Math.min(100,(pip+(1-this.run.remaining/cur.seconds))/pps*100);
        }
        // announce what's next just before the countdown beeps; skipped on phases too short for it
        if(this.settings.heads && !cur.announced && cur.seconds>=8 && this.run.remaining<=6.5 && this.run.remaining>4){
          cur.announced=true;
          if(this.run.steps[this.run.idx+1]) this.say('Next: '+this.spokenStep(this.run.idx+1,true));
        }
        if(this.run.remaining<=3.999 && Math.ceil(this.run.remaining)!==Math.ceil(this.run.remaining+dt) && this.run.remaining>0){
          this.beep(660,0.07);
        }
        if(this.run.remaining<=0){ this._advance(); }
      },50);
    },
    // "Stretch", or "90/90 Hip Switches – Stretch" when the next step starts a new exercise
    upNextLabel(steps,idx){
      const cur=steps[idx], next=steps[idx+1];
      if(!next) return '';
      if(!next.exTitle || (cur.exTitle===next.exTitle && cur.kind!=='prep')) return next.name;
      return next.name===next.exTitle ? next.name : next.exTitle+' – '+next.name;
    },
    _advance(){
      const done=this.run.steps[this.run.idx];
      if(done && done.lastOfEx && this.session && this.run.returnTo==='session'){
        this.session.exDone[done.exIndex]=true; this.session.lastExerciseTs=Date.now(); this.saveSession();
      }
      if(this.run.idx+1>=this.run.steps.length){ this._finishRun(); return; }
      this.run.idx++;
      const cur=this.run.steps[this.run.idx];
      this.run.remaining=cur.seconds; this.run.kind=cur.kind;
      this.run.phaseName=cur.name; this.run.contextLabel=cur.ctx; this.run.pct=0;
      this.run.setNum=cur.setNum||0;
      if(cur.totalSets) this.run.totalSets=cur.totalSets;
      const sn=cur.setNum, pps=cur.phasesPerSet, ts=this.run.totalSets;
      this.run.setPct=(sn>0&&pps>0&&ts>0) ? ((sn-1)*pps+cur.phaseInSet)/(ts*pps)*100 : 0;
      this.run.curSetPct=(sn>0&&pps>0) ? (cur.phaseInSet/pps*100) : 0;
      this.run.upNext=this.upNextLabel(this.run.steps,this.run.idx);
      this.beep(cur.kind==='rest'?440:880,0.12);
      this.vibrate(cur.kind);
      this.say(this.spokenStep(this.run.idx));
    },
    _finishRun(){
      clearInterval(this._tick);
      this.beep(990,0.18); setTimeout(()=>this.beep(1320,0.22),180);
      this.vibrate('finish');
      this.say('Done. Well done!');
      this.run.finished=true; this._syncWakeLock();
      if(this.run.logOnFinish){
        this.log.push({ ts:Date.now(), programId:null, name:this.run.label, date:this._dateKey(new Date()) });
        this.save();
      }
      if(this.run.returnTo==='session' && this.session && this.run.exIndex!=null){
        this.session.exDone[this.run.exIndex]=true;
        this.session.lastExerciseTs=Date.now();
        this.saveSession();
      }
    },
    startRunFromPrep(){ // user presses the big start; un-pause and beep
      this.run.paused=false; this.beep(880,0.12); this.vibrate('work'); this._syncWakeLock();
      // speaking inside the tap also unlocks speech on iOS for the rest of the run
      this.say(this.spokenStep(this.run.idx));
    },
    togglePause(){ this.run.paused=!this.run.paused; this._syncWakeLock(); if(this.run.paused) this.hush(); },
    skipPhase(){ this.run.remaining=0; },
    // leave the interval overlay back to where we came from (session keeps progress, but
    // the current in-progress exercise is NOT marked done)
    exitRun(){
      clearInterval(this._tick); this.hush();
      const back=this.run.returnTo;
      this.run={active:false}; this._syncWakeLock();
      if(back==='session'){ this.resumeSession(); }
    },
    // called from the "Done" button on the finished screen
    closeRun(){
      clearInterval(this._tick);
      const back=this.run.returnTo;
      this.run={active:false}; this._syncWakeLock();
      if(back==='session'){ this.resumeSession(); }
    },

    // ---------- stopwatch ----------
    // Time comes from Date.now(), so it stays right across backgrounding and reloads.
    swElapsed(){ return this.sw.base+(this.sw.startTs ? Date.now()-this.sw.startTs : 0) },
    swSave(){ localStorage.setItem(this._key('it_stopwatch'), JSON.stringify(this.sw)); },
    _swStartTick(){ clearInterval(this._swTick); this.swNow=this.swElapsed(); this._swTick=setInterval(()=>{ this.swNow=this.swElapsed(); },50); },
    openStopwatch(){ this.swNow=this.swElapsed(); this.showStopwatch=true; this._syncWakeLock(); },
    closeStopwatch(){ this.showStopwatch=false; this._syncWakeLock(); },
    swToggle(){
      if(this.sw.startTs){ this.sw.base=this.swElapsed(); this.sw.startTs=null; clearInterval(this._swTick); this.swNow=this.sw.base; }
      else { this.sw.startTs=Date.now(); this._swStartTick(); this.beep(880,0.12); }
      this.swSave(); this._syncWakeLock();
    },
    swLap(){ this.sw.laps.push(this.swElapsed()); this.swSave(); this.beep(660,0.07); },
    swReset(){ clearInterval(this._swTick); this.sw={startTs:null,base:0,laps:[],name:this.sw.name}; this.swNow=0; this.swSave(); },
    swLog(){
      const name=(this.sw.name||'').trim()||'Stopwatch', now=new Date();
      this.log.push({ ts:now.getTime(), programId:null, name, date:this._dateKey(now), seconds:Math.round(this.sw.base/1000) });
      this.save(); this.swReset(); this.showStopwatch=false; this._syncWakeLock();
    },
    // 1:02:03 / 2:03 (+ hundredths when big)
    fmtStopwatch(ms,big){
      ms=Math.max(0,ms); const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t/60)%60, s=t%60;
      const main=(h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(s).padStart(2,'0');
      return big ? main+'<small>.'+String(Math.floor(ms/10)%100).padStart(2,'0')+'</small>' : main;
    },

    // ---------- audio session ----------
    // Safari's Audio Session API decides whether our beeps/voice pause, duck or mix with other apps' audio.
    audioSessionSupported(){ return !!(navigator.audioSession) },
    applyAudioSession(){ try{ if(navigator.audioSession) navigator.audioSession.type=this.settings.audioMix||'auto'; }catch(e){} },

    // ---------- voice ----------
    // What to say for a step: its name, led by the exercise title when a new exercise starts,
    // plus the set number on the first phase of later sets. withDuration is for the heads-up.
    spokenStep(idx,withDuration){
      const st=this.run.steps[idx], prev=this.run.steps[idx-1];
      if(!st) return '';
      if(st.kind==='prep') return (st.exTitle ? st.exTitle+'. ' : '')+'Get ready';
      if(!st.exTitle && this.run.steps[idx+1]) return st.name+'. Up next: '+this.spokenStep(idx+1,true); // break between exercises
      const parts=[];
      const newEx=st.exTitle && prev && prev.kind!=='prep' && prev.exTitle!==st.exTitle;
      if(newEx && st.name!==st.exTitle) parts.push(st.exTitle);
      parts.push(st.name);
      if(st.totalSets>1 && st.setNum>1 && st.phaseInSet===0) parts.push('set '+st.setNum+' of '+st.totalSets);
      if(withDuration && this.settings.durations && st.seconds>=10) parts.push(this.spokenDuration(st.seconds));
      return parts.join(', ');
    },
    spokenDuration(s){
      s=Math.round(s);
      const m=Math.floor(s/60), r=s%60;
      return [m ? m+(m===1?' minute':' minutes') : '', r ? r+' seconds' : ''].filter(Boolean).join(' ');
    },
    speechSupported(){ return 'speechSynthesis' in window },
    // Voices load asynchronously in most browsers; ones matching the device language come first.
    loadVoices(){
      const lang=(navigator.language||'en').slice(0,2).toLowerCase();
      this.voices=speechSynthesis.getVoices()
        .map(v=>({uri:v.voiceURI,name:v.name,lang:v.lang}))
        .sort((a,b)=>(b.lang.toLowerCase().startsWith(lang))-(a.lang.toLowerCase().startsWith(lang)) || a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name));
    },
    saveSettings(){ localStorage.setItem(this._key('it_settings'), JSON.stringify(this.settings)); },
    say(text,force){
      if(!(this.settings.voice||force) || !text || !this.speechSupported()) return;
      try{
        speechSynthesis.cancel(); // never let announcements queue up behind the clock
        const u=new SpeechSynthesisUtterance(text);
        const v=this.settings.voiceURI && speechSynthesis.getVoices().find(x=>x.voiceURI===this.settings.voiceURI);
        if(v){ u.voice=v; u.lang=v.lang; }
        u.rate=+this.settings.rate||1; u.pitch=+this.settings.pitch||1; u.volume=+this.settings.volume||1;
        speechSynthesis.speak(u);
      }catch(e){}
    },
    testVoice(){ this.say('Next: Plank'+(this.settings.durations?', 30 seconds':''), true); },
    hush(){ try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){} },
    toggleVoice(){
      this.settings.voice=!this.settings.voice; this.saveSettings();
      if(this.settings.voice) this.say('Voice on'); else this.hush();
    },

    // ---------- audio ----------
    beep(freq,dur){
      try{
        this._audioCtx=this._audioCtx||new (window.AudioContext||window.webkitAudioContext)();
        const ctx=this._audioCtx, o=ctx.createOscillator(), g=ctx.createGain();
        o.frequency.value=freq; o.type='sine'; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.18,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
        o.start(); o.stop(ctx.currentTime+dur);
      }catch(e){}
    },

    vibrate(kind){
      if(navigator.vibrate){
        try{
          if(kind==='finish') navigator.vibrate([150,80,150,80,150]);
          else if(kind==='rest') navigator.vibrate([80,60,80]);
          else navigator.vibrate(200);
        }catch(e){}
        return;
      }
      // iOS fallback: noise bursts mimic haptic patterns
      if(this.settings.clicks) this._hapticClick(kind);
    },
    _hapticClick(kind){
      try{
