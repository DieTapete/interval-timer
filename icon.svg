<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="110" fill="#0f1115"/>
  <!-- Outer track ring -->
  <circle cx="256" cy="284" r="160" fill="#1a1d24"/>
  <!-- Progress arc ~75% -->
  <circle cx="256" cy="284" r="160" fill="none" stroke="#4f8cff" stroke-width="22"
          stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="251"
          transform="rotate(-90 256 284)"/>
  <!-- Inner face -->
  <circle cx="256" cy="284" r="118" fill="#0f1115"/>
  <!-- Hour hand -->
  <line x1="256" y1="284" x2="256" y2="194" stroke="#e6e8ec" stroke-width="14" stroke-linecap="round"/>
  <!-- Second hand (pointing ~2 o'clock) -->
  <line x1="256" y1="284" x2="326" y2="238" stroke="#38d39f" stroke-width="10" stroke-linecap="round"/>
  <!-- Center cap -->
  <circle cx="256" cy="284" r="16" fill="#4f8cff"/>
  <!-- Crown stem -->
  <rect x="238" y="96" width="40" height="28" rx="8" fill="#1a1d24" stroke="#2e333f" stroke-width="2"/>
  <!-- Crown top -->
  <rect x="242" y="78" width="28" height="22" rx="11" fill="#4f8cff"/>
  <!-- Side button -->
  <rect x="408" y="238" width="26" height="42" rx="13" fill="#4f8cff"/>
</svg>
